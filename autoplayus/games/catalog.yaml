# Catálogo de minijuegos de Playus (rellenar hasta los 70).
# agent: clave de autoplayus/agents/__init__.py -> AGENT_TYPES
# params: parámetros propios del juego (región del tablero, filas/columnas, umbrales...)
games:
  - id: FireFly
    name: FireFly
    agent: fire_fly
    params:
      strip: [300, 400, 420, 790]  # x_min, y_min, x_max, y_max de la franja del rayo donde se buscan luciérnagas
      fork_y: 715                  # y de la bifurcación del rayo
      margin: 25                   # una luciérnaga a menos de esto de la bifurcación no se puede redirigir
      speed: 270                   # px/s a los que cae una luciérnaga (medido al principio de la partida)
      lead: 0.2                  # s hasta que un toque surte efecto (antigüedad de la captura ~0,15 s + clic)
      settle: 0.5                # s tras un toque en los que se confía en lo esperado y no en el rayo leído
      star: [360, 734]             # estrella de la bifurcación: su color indica la dirección del rayo
      tap: [360, 640]              # punto donde se toca para cambiar el rayo
      min_area: 200               # píxeles mínimos de la mancha de color de una luciérnaga

  - id: ParcelPanic
    name: ParcelPanic
    agent: parcel_panic
    params:
      belt: [130, 330, 600, 1180]  # x_min, y_min, x_max, y_max de la cinta donde se busca el recuadro blanco
      white_min: 160               # valor mínimo (B,G,R) del recuadro blanco: se desvanece al animarse y se difumina al escalar
      frame_w: [75, 110]           # ancho mín/máx del recuadro (late entre ~81 y ~89 px)
      frame_h: [50, 80]            # alto mín/máx del recuadro
      min_color_px: 150            # píxeles mínimos del color ganador dentro del recuadro
      ambiguity: 0.3               # si el 2º color supera esta fracción del 1º, no se desliza (esperar fotograma claro)
      new_box_dy: 25               # el recuadro subió más de esto: es otra caja (las cajas solo bajan)
      min_gap_s: 0.1               # s mínimos entre deslizamientos
      settle_s: 0.25               # s tras un deslizamiento en los que se ignoran fotogramas capturados antes (retraso del juego + de la captura)
      retry_s: 0.6                 # s tras los que se reintenta si el recuadro sigue (deslizamiento fallido)
      swipe_ms: 30                 # duración del gesto
      swipes:                      # x1, y1, x2, y2 por color: rojo <-, amarillo ^, azul ->
        red: [470, 1050, 250, 1050]
        yellow: [360, 1120, 360, 900]
        blue: [250, 1050, 470, 1050]

  - id: Piano
    name: Piano
    agent: piano
    params:
      lanes_x: [111, 277, 444, 610]  # x del centro de cada uno de los 4 carriles
      band_half: 30                  # semiancho de la banda central del carril donde se busca blanco (evita el dígito de puntuación)
      play_top: 216                  # y donde empieza la zona de juego (por encima está la cabecera)
      white_min: 200                 # valor mínimo del canal verde de una tecla (~238; el fondo y las teclas apagadas tienen <70)
      min_len: 60                    # alto visible mínimo para contarla como tecla (descarta las que aún entran)
      key_h: 272                     # alto real de una tecla (paso entre filas: 277)
      max_move: 270                  # px máximos que una tecla puede bajar entre dos capturas para reconocerla (menos que el paso entre filas, 277)

  - id: LaneRush
    name: LaneRush
    agent: lane_rush
    params:
      horizon_y: 818                 # y donde asoman los coches rivales (la carretera empieza en ~812)
      row_step: 2                    # se mira una de cada tantas filas de la carretera
      half_lane:                     # [y, semiancho de carril]: distancia de x=360 a cada línea divisoria (perspectiva curvada)
        - [812, 40]
        - [820, 45]
        - [860, 62]
        - [900, 75]
        - [940, 85]
        - [980, 95]
        - [1020, 105]
        - [1060, 115]
        - [1100, 125]
        - [1140, 130]
        - [1180, 135]
        - [1220, 145]
        - [1280, 160]
      play_x: [28, 692]              # x mínima y máxima de la zona de juego (fuera, margen morado)
      corridor: 0.5                  # semiancho de la franja que se mira en cada carril, en semianchos de carril (no toca las líneas)
      road_bgr: [45, 45, 60]         # color del asfalto
      road_tol: 30                   # diferencia máxima con el asfalto en algún canal para contar como asfalto
      min_fill: 0.25                 # fracción de la fila que no es asfalto para considerarla ocupada por un coche
      player_rows: [1000, 1180]      # filas que ocupa el coche del jugador
      own_lane_max_y: 980            # en el carril del jugador solo se buscan rivales por encima de esto (su techo llega a ~990 al girar)
      player_lanes_x: [138, 360, 582]  # x (mediana del verde) del coche del jugador en cada carril
      player_reach_px: 175           # el coche del jugador (semiancho ~114) pisa la franja de un carril (semiancho ~61) si su x está a menos de esto del centro del carril
      player_min_px: 500             # píxeles verdes mínimos (muestreando 1 de cada 4 filas) para dar el coche por visto
      settle_px: 20                  # a más de esto del centro de un carril, el coche está cambiando de carril
      approach_s:                    # [y inferior de un rival, s hasta llegar al jugador] a la velocidad de referencia (principio de la partida)
        - [818, 0.41]
        - [820, 0.397]
        - [830, 0.338]
        - [840, 0.28]
        - [860, 0.221]
        - [880, 0.163]
        - [914, 0.106]
        - [950, 0.047]
        - [1000, 0.0]
        - [1280, -0.3]               # ya a la altura del jugador
      speed_window: 0.04             # s entre las dos posiciones de un rival con las que se mide la velocidad
      decide_y: 824                  # desde el centro, no decidir hasta que el rival baje hasta aquí (a veces otro a la par asoma después y decide el lado)
      min_ttc: 0.22                  # no entrar ni cruzar un carril cuyo rival llegue al jugador antes de esto (el cambio dura ~0,15 s)
      escape_ttc: 0.08               # margen mínimo si no queda otra (quedarse en el carril es chocar seguro)
      chain_gap_s: 0.05              # s entre los dos toques para cruzar dos carriles (el juego acepta toques durante la animación)
      arrive_px: 60                  # tras pedir un cambio, a esta distancia del carril destino (pasada la mitad) ya se puede encadenar otro
      appear_y: 840                  # un coche que aparece por encima de esto acaba de asomar: empieza una oleada
      wave_join_s: 0.12              # coches que asoman con menos de esto entre sí son de la misma oleada
      wave_gap_factor: 0.8           # la oleada siguiente puede asomar tras esta fracción del menor de los últimos intervalos
      return_to_center: false        # volver al centro sin necesidad cuando parece haber tiempo (moverse deja sin reacción ante la oleada siguiente)
      reposition_s: 0.15             # s libres antes de la oleada siguiente necesarios para volver al centro (pasar la mitad del cambio con margen)
      move_timeout: 0.4              # s máximos esperando a que termine un cambio de carril antes de volver a decidir
      dim_max: 90                    # cielo más oscuro que esto en (100, 300): tutorial superpuesto
      tap_left: [60, 1100]           # toque en el lado izquierdo: un carril a la izquierda
      tap_right: [660, 1100]         # toque en el lado derecho: un carril a la derecha

  - id: React
    name: React
    agent: react
    params:
      circles:                       # centro (x, y) de los 9 círculos, por filas
        - [192, 580]
        - [360, 580]
        - [528, 580]
        - [192, 748]
        - [360, 748]
        - [528, 748]
        - [192, 916]
        - [360, 916]
        - [528, 916]
      patch: 6                       # semilado del parche que se promedia en el centro de cada círculo
      green_min: 150                 # canal verde mínimo de un círculo encendido (~212; apagado ~55)
      red_max: 100                   # canal rojo máximo (descarta el blanco del tutorial; encendido ~0)
      off_bgr: [72, 55, 45]          # color de un círculo apagado
      off_tol: 20                    # diferencia máxima por canal con off_bgr para darlo por apagado
      max_lit: 1                     # círculos encendidos a la vez: el resto debe verse apagado (si no, no es la cuadrícula)

  - id: Zig
    name: Zig
    agent: zig
    params:
      ball_rows: [600, 1000]         # filas donde puede estar la bola (negra; la cámara la mantiene cerca de y~800-830)
      ball_dark: 50                  # valor máximo (B,G,R) de un píxel de la bola
      ball_px: [60, 300]             # píxeles oscuros mínimos y máximos (muestreando 1 de cada 2) para dar la bola por vista (~120-140)
      heading_deg: [27, 142]         # ángulo con la horizontal de los dos sentidos de avance (derecha, izquierda), medido en los bordes del camino
      ray_start_px: 20               # los rayos empiezan fuera de la bola (radio ~16)
      ray_max_px: 300                # alcance máximo de los rayos
      ray_step_px: 3                 # paso entre puntos de un rayo
      ray_side_px: 6                 # separación de los rayos laterales respecto al central (ancho de la bola; 6 mejor que 10 en el simulador)
      look_s: 0.12                   # s que recorre la bola entre decidir girar y girar de verdad (retraso medido en vivo 0,06-0,1 s, más margen)
      margin_px: 14                  # px de camino que se dejan además de lo recorrido en look_s
      min_scroll_pxs: 50             # bajada mínima supuesta del camino (px/s) mientras aún no se ha medido (~60 al empezar)
      block_s: 0.1                   # s tras un toque sin volver a decidir: algo más que el retraso del toque (0,06-0,1 s). Con 0,2 llegaba tarde a los zigzags seguidos a velocidad alta
      start_dir: -1                  # dirección de la bola al empezar (sale hacia la izquierda; luego cada toque la invierte)
      scroll_window_s: 0.1           # s sobre los que se promedia el desplazamiento del camino
      dir_min_pxs: 30                # px/s de desplazamiento lateral mínimo para fiarse de la dirección leída (~90 al principio, ~140 al final)
      resync_s: 0.4                  # s seguidos que la dirección leída debe contradecir a la de los toques para corregirla
      tap: [360, 1000]               # punto donde se toca (cualquiera sirve: cambia la dirección)

  - id: DiceRoll
    name: Dice Roll
    agent: dice_roll
    params:
      dice: [[276, 431], [444, 431], [276, 599], [444, 599]]  # centro de cada dado, por filas (caras de ~105 px)
      die_half: 48                   # semilado de la zona que se analiza dentro de cada cara (queda dentro aunque la cara no esté perfecta)
      white_min: 215                 # canal mínimo (B,G,R) de un píxel blanco de la cara (~240)
      pip_max: 90                    # canal máximo de un píxel de punto (negro)
      pip_min_px: 60                 # área mínima de una mancha para contarla como punto (~320-370 asentado)
      pip_frac: 0.0525               # fracción de la zona que ocupa cada punto: el blanco restante es 1 - n * pip_frac
      stable_s: 0.018                # s que la misma lectura coherente debe mantenerse antes de teclear: algo más de un fotograma del juego (~60 fps). En la partida humana no hubo ninguna lectura coherente equivocada con los dados rodando
      keys:                          # centro de cada tecla del teclado numérico
        "1": [181, 893]
        "2": [360, 893]
        "3": [539, 893]
        "4": [181, 992]
        "5": [360, 992]
        "6": [539, 992]
        "7": [181, 1090]
        "8": [360, 1090]
        "9": [539, 1090]
        "0": [360, 1188]
      backspace: [539, 1188]
      digit_gap_s: 0.015             # s entre las dos cifras de una suma de dos dígitos (con 0,03 se registraron siempre; 0 sin probar)
      typed_box: [690, 830, 150, 570]  # y0, y1, x0, x1 de la zona donde aparece el número tecleado
      green_px: 3000                 # píxeles verdes mínimos en esa zona para dar la suma por acertada (~9000-13000 al acertar)
      check_s: 0.4                   # s tras teclear sin ver el número en verde para considerar que falló y repetir (el verde salió en <0,2 s)
      max_retries: 2
      early_mode: predict            # off | predict | asap: cuándo teclear respecto al asentamiento (ver DiceRoll)
      landing_half: 62               # semilado de la zona por dado al leer durante el aterrizaje (dados ~115 px)
      early_stable_s: 0.12           # s que la lectura de aterrizaje debe mantenerse (las falsas duraron hasta 0,10 s)
      roll_s: 1.329                  # s entre que los dados dejan de leerse (ronda anterior) y se asientan: 1,328 y 1,330 medidos
      lead_s: 0.05                   # s antes del asentamiento previsto a los que se teclea (el toque tarda ~0,07 s en llegar al juego)
      fallback_s: 0.1                # s tras asentarse sin ver nada tecleado para dar el adelanto por rechazado
      typed_px: 1500                 # píxeles blancos o verdes en typed_box para dar por visible un número tecleado (~3000 por cifra)

  - id: Grid
    name: Grid
    agent: grid
    params:
      grid_rows: [380, 1110]         # filas donde está la cuadrícula
      background_bgr: [26, 19, 18]   # color del fondo
      background_tol: 12             # diferencia mínima con el fondo para contar como casilla
      tile_px: [40, 170]             # lado mínimo y máximo de una casilla (~116 px en 5x5; menores al crecer la cuadrícula)
      tile_square_tol: 12            # diferencia máxima entre ancho y alto de una casilla
      okay_box: [270, 1150, 450, 1200]  # x0, y0, x1, y1 dentro del botón "Okay!" (verde)
      okay: [360, 1174]              # centro del botón "Okay!"
      tap_gap_s: 0.15                # s entre toques a casillas, de una en una (con 0,03 el juego perdía toques)
      verify_s: 0.4                  # s tras el último toque antes de comprobar (la casilla tocada se anima y no se lee bien)
      max_fixes: 3                   # correcciones como máximo por nivel
      tutorial_max: 14               # canal máximo del fondo en (360, 300) con el tutorial superpuesto (en juego ~26)

  - id: Trace
    name: Trace
    agent: trace
    params:
      panel_rows: [470, 1150]        # filas del panel de puntos
      center: [359, 826]             # centro de la retícula hexagonal (igual en todas las rondas vistas)
      dot_contrast: 12               # cuánto más claro (canal rojo) que el panel suavizado es un punto
      dot_area: [120, 2500]          # área en px de un punto detectado
      yellow_px: 20                  # píxeles amarillos (muestreando 1 de cada 4x4) para dar la ruta por visible
      timer_box: [150, 405, 570, 435]  # x0, y0, x1, y1 de la barra de tiempo (aparece al poder trazar)
      segment_ms: 100                # ms por tramo del arrastre

  - id: ColorMemory
    name: Color Memory
    agent: color_memory
    params:
      sample_box: [15, 480, 45, 520]  # x0, y0, x1, y1 del parche del fondo que se lee (fuera de controles)
      uniform_points: [[30, 500], [690, 500], [360, 900], [100, 1200]]  # en "Memoriza" toda la pantalla es un color
      uniform_tol: 6                 # diferencia máxima entre esos puntos para dar la pantalla por uniforme
      rows: [712, 864, 1016]         # y de los deslizadores de tono, saturación y brillo
      track_x: [60, 660]             # x donde se buscan los botones (y límites de arrastre)
      knob_white: 235                # canal mínimo de un píxel del botón blanco
      knob_px: [20, 80]              # ancho en px del botón en su fila
      slope_px:                      # px por unidad de valor (calibrado en la partida humana; se corrige en vivo)
        hue: 1.19                    # px por grado (428 px para 360°)
        sat: 607.5                   # px por unidad de saturación (0-1)
        val: 618.6                   # px por unidad de brillo (0-1)
      tolerance:                     # error admitido por deslizador
        hue: 1.0                     # grados
        sat: 0.006
        val: 0.006
      max_moves: 6                   # arrastres como máximo por deslizador y pasada
      passes: 2                      # pasadas por los tres deslizadores
      settle_s: 0.25                 # s tras un arrastre antes de medir el color resultante
      drag_ms: 120                   # ms por tramo de cada arrastre (alejarse y volver)
      overshoot_px: 40               # cuánto se aleja el dedo antes de ir al punto exacto (umbral de arrastre de Android ~10-15 px)
      overshoot_max_px: 120          # alejamiento máximo si los arrastres no mueven el botón
      stuck_min_px: 6                # solo se considera que un arrastre no movió el botón si se pedía mover al menos esto
      submit: [360, 1132]            # botón "FIJAR"

  - id: DangerWall
    name: Danger Wall
    agent: danger_wall
    params:
      arena: [31, 228, 690, 1276]    # x0, y0, x1, y1 de la zona de juego (entre las paredes y las líneas rojas de techo y suelo)
      white_min: 235                 # canal mínimo (B,G,R) de un píxel de la caja
      open_px: 30                    # lado de la apertura que borra estela y marcador (la caja mide ~71 px)
      box_area_px: [2500, 12000]     # área tras la apertura para dar la caja por vista (~4200-6200; más si pasa por el marcador)
      spike_col: [35, 685]           # x de la columna, pegada a cada pared, donde se leen las bases de los pinchos
      spike_len: [62, 76]            # alto de la base de un pincho completo (~69-71); fuera de eso está apareciendo o escondiéndose
      spike_min_len: 2               # tramos rojos más cortos se ignoran (ruido)
      wall_x: [31, 689]              # x de cada pared
      spike_depth: 49                # px que entra la punta del pincho desde la pared
      box_half: 35.5                 # mitad del lado de la caja (cuadrado de ~71 px que gira; ver rot_*)
      rot_deg_per_px: 0.305          # grados que gira la caja por px que avanza (178° de pared a pared; medido en vivo)
      rot_x0: 65.6                   # x donde la caja está recta (también lo está al llegar a la derecha)
      hit_margin: 2                  # px de holgura que se restan frente a los pinchos (en vivo, el rebote más justo pasó con <1 px)
      floor_margin: 4                # px que se dejan con el techo y el suelo
      contact_x: [66.5, 653.5]       # x del centro de la caja al rebotar: pared -/+ box_half. Con [72, 648] (medido a 20 fps, se quedaba corto) se daba por libre un hueco que chocaba por 2 px
      vx: [250, 12.3]                # px/s horizontales = a + b * puntos (ajuste de la partida humana; en vivo igual)
      gravity: [860, 39.4]           # px/s² = a + b * puntos (42 tramos de la primera partida en vivo)
      jump: [-468, -12.3]            # vy tras un toque (px/s) = a + b * puntos (ídem, con el retraso de 0,07 s)
      max_score_fit: 25              # desde 25 puntos el juego ya no acelera (vx ~558, g ~1830, salto ~-765 en vivo)
      calib_segments: 6              # tramos entre toques recientes con que se corrigen g y el salto (mediana)
      calib_clip: [0.85, 1.15]       # corrección máxima de g y del salto respecto al ajuste
      calib_min_pts: 8               # posiciones mínimas en un tramo para calibrar con él
      calib_min_span_s: 0.25         # duración mínima del tramo
      calib_margin_s: 0.02           # s que se dejan antes del toque siguiente (por si surtió efecto antes)
      tap_latency_s: 0.07            # s entre enviar un toque y que la caja salte (estimado; medir en vivo)
      fit_after_tap_s: 0.03          # tras surtir efecto un toque, s que se ignoran las posiciones al estimar vy
      vy_window_s: 0.25              # s de posiciones con las que se estima vy (en el simulador, mejor que 0,15 con ruido de ~2 px)
      vy_min_pts: 4                  # posiciones mínimas para estimar vy; con menos se usa el modelo desde el último toque
      dir_window_s: 0.05             # s sobre los que se mide hacia dónde va la caja
      dir_min_dx: 6                  # px mínimos en esa ventana para fiarse de la dirección
      vx_min_span_s: 0.15            # s de tramo mínimos para medir vx (antes se usa el ajuste)
      empty_after_s: 0.5             # s tras un rebote antes de aceptar que una pared no tiene pinchos
      stable_frames: 2               # lecturas iguales seguidas para dar los pinchos de una pared por buenos
      regen_s: 0.2                   # s tras un rebote antes de aceptar los pinchos nuevos de esa pared
      plan_dt: 0.0166667             # paso del planificador (s): un fotograma del juego
      max_horizon_s: 2.6             # horizonte máximo del plan
      after_contact_s: 0.3           # s que se planifica tras el último rebote del horizonte
      near_wall_px: 130              # solo se comprueban pinchos con el centro de la caja a menos de esto de su pared
      map_px: 2                      # resolución (px) del mapa de holgura
      clear_cap: 60                  # holgura a partir de la cual dos planes se consideran igual de buenos
      dead_clear: -30                # estados con peor holgura se descartan (si hay alguno mejor)
      tap_every: 3                   # tras el primer paso, el plan solo puede tocar cada tantos pasos (rapidez)
      tap_bins: [4, 20]              # px y px/s con los que se funden estados casi iguales
      max_states: 1500               # estados como máximo por paso del plan
      tap_gain_px: 0                 # mejora de holgura que debe dar tocar ahora frente a esperar
      tap: [360, 1100]               # punto donde se toca (cualquiera de la zona de juego)
